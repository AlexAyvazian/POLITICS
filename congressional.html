<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#050814">
 <title>Congressional Atlas · POLITICS</title>
 <link rel="stylesheet" href="assets/css/atlas.css">
 <link rel="stylesheet" href="assets/css/congressional.css">
 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
 <link rel="stylesheet" href="assets/css/congressional-existing-map.css">
</head>
<body data-view="congress">
 <header class="congressTop">
  <div class="congressIdentity"><span class="congressDot"></span><span>POLITICS</span><span class="congressTitle">Congressional Atlas</span></div>
  <nav class="atlasViews" aria-label="Atlas pages">
   <a href="index.html#map" class="atlasViewLink">County Atlas</a>
   <span class="atlasViewCurrent" aria-current="page">Congressional Atlas</span>
  </nav>
 </header>
 <main class="congressLayout">
  <section class="congressStage" aria-label="Interactive federal and state legislative district map">
   <div class="congressToolbar">
    <div class="congressInputs">
     <label for="congressState">State</label>
     <select id="congressState" aria-label="Choose state"><option value="">United States — choose a state</option></select>
    </div>
    <div class="congressInputs layerInput">
     <label for="districtLayer">Political representation</label>
     <select id="districtLayer" aria-label="Choose representation layer">
      <optgroup label="Federal government">
       <option value="house">U.S. House districts</option>
       <option value="senate">U.S. Senate (statewide)</option>
       <option value="president">President (nationwide)</option>
      </optgroup>
      <optgroup label="State government">
       <option value="stateHouse">State House / Assembly districts</option>
       <option value="stateSenate">State Senate districts</option>
       <option value="governor">Governor (statewide)</option>
      </optgroup>
     </select>
    </div>
    <button id="congressBack" type="button" hidden>← U.S. map</button>
   </div>
   <div class="congressMapWrap">
    <div id="legislativeMap" role="application" aria-label="Independent map of United States congressional and state legislative district boundaries"></div>
    <div class="congressMapLabel" id="districtMapLabel">Select a state to explore its representation</div>
    <div class="congressLoading" id="congressLoading" hidden role="status" aria-live="polite">Loading district boundaries…</div>
   </div>
   <div class="congressSourceBar"><span id="districtVintage">Official district map · U.S. Census</span><a href="https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/Legislative/MapServer" target="_blank" rel="noopener noreferrer">Source: U.S. Census Bureau TIGERweb</a></div>
  </section>
  <aside class="congressSide" aria-label="Political representation details">
    <div class="sideEyebrow">POLITICAL REPRESENTATION</div>
    <div id="districtPanel" aria-live="polite"></div>
  </aside>
 </main>
 <div class="congressTooltip" id="congressTooltip" role="status" hidden></div>
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
 <script src="https://unpkg.com/esri-leaflet@3.0.8/dist/esri-leaflet.js" integrity="sha512-E0DKVahIg0p1UHR2Kf9NX7x7TUewJb30mxkxEm2qOYTVJObgsAGpEol9F6iK6oefCbkJiA4/i6fnTHzM6H1kEA==" crossorigin=""></script>
 <script src="assets/js/states.js"></script>
 <script src="assets/js/ncsl-control.js"></script>
 <script src="assets/js/governors.js"></script>
 <script src="assets/js/congressional-existing-map.js"></script>
</body>
</html>
