name: Refresh congressional bill explanations
on:
  schedule:
    - cron: "14 14 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/update_congressional_bill_summaries.py
      - .github/workflows/refresh-congressional-bill-explanations.yml
permissions:
  contents: write
concurrency:
  group: congressional-bill-explanations
  cancel-in-progress: false
jobs:
  summaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch verifiable legislative descriptions
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python scripts/update_congressional_bill_summaries.py
      - name: Commit new official summaries
        run: |
          git add assets/data/records/measures-119.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update congressional bill titles and official descriptions"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
