name: Inspect official GovInfo bill summary structure
on:
  push:
    paths:
      - scripts/inspect_govinfo_summaries.py
      - .github/workflows/inspect-govinfo.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/inspect_govinfo_summaries.py
