name: Refresh housing finance context

on:
  workflow_dispatch:
  schedule:
    - cron: "43 2,14 * * *"
  push:
    paths:
      - scripts/update_housing_finance.py
      - .github/workflows/refresh-housing-finance.yml

permissions:
  contents: write

concurrency:
  group: refresh-housing-finance
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify housing finance transforms
        run: python3 -m unittest discover -s tests -p test_housing_finance.py -v
      - name: Refresh HMDA and CFPB statewide context
        run: python3 scripts/update_housing_finance.py
      - name: Commit refreshed housing finance snapshot
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/data/state/housing-finance.json)" ]; then
            echo "Housing finance snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/state/housing-finance.json
          git commit -m "Refresh statewide housing finance context"
          git push origin HEAD:${GITHUB_REF_NAME}
