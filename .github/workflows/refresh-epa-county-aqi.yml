name: Refresh EPA annual county AQI

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4,16 * * *"
  push:
    paths:
      - scripts/update_epa_county_aqi.py
      - tests/test_epa_county_aqi.py
      - .github/workflows/refresh-epa-county-aqi.yml

permissions:
  contents: write

concurrency:
  group: refresh-epa-county-aqi
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify EPA transform and missing-county semantics
        run: python3 -m unittest discover -s tests -p test_epa_county_aqi.py -v
      - name: Download official EPA annual county AQI when available
        shell: bash
        run: |
          if curl --http1.1 --fail --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 90 \
            --user-agent "POLITICS civic transparency project" \
            --output /tmp/epa-aqi-2025.zip \
            https://aqs.epa.gov/aqsweb/airdata/annual_aqi_by_county_2025.zip; then
            unzip -t /tmp/epa-aqi-2025.zip
          else
            echo "EPA AirData ZIP host unavailable; parser will use the published EPA-derived mirror."
            rm -f /tmp/epa-aqi-2025.zip
          fi
      - name: Inspect official EPA 2025 county statistics workbook
        shell: bash
        run: |
          python3 -m pip install --quiet openpyxl
          curl --fail --location --retry 4 --retry-all-errors --output /tmp/epa-county-2025.xlsx \
            https://www.epa.gov/system/files/documents/2026-06/aqstatsbycounty2025.xlsx
          python3 - <<'PY'
          from openpyxl import load_workbook
          wb=load_workbook('/tmp/epa-county-2025.xlsx',read_only=True,data_only=True)
          print('SHEETS',wb.sheetnames)
          for ws in wb.worksheets:
              print('SHEET',ws.title,'MAX',ws.max_row,ws.max_column)
              for row in ws.iter_rows(min_row=1,max_row=min(ws.max_row,8),values_only=True):
                  print('ROW',repr(row[:18]))
          PY
      - name: Refresh EPA annual county AQI
        env:
          EPA_AQI_ZIP: /tmp/epa-aqi-2025.zip
        run: python3 scripts/update_epa_county_aqi.py
      - name: Commit changed EPA snapshot
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/data/county/epa-aqi-2025.json)" ]; then
            echo "EPA annual AQI snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/county/epa-aqi-2025.json
          git commit -m "Refresh EPA annual county AQI"
          git push origin HEAD:${GITHUB_REF_NAME}
