name: Refresh CMS Part B provider activity

on:
  workflow_dispatch:
  schedule:
    - cron: "11 4,16 * * *"
  push:
    paths:
      - scripts/update_cms_partb_provider_activity.py
      - .github/workflows/refresh-cms-partb-provider-activity.yml

permissions:
  contents: write

concurrency:
  group: refresh-cms-partb-provider-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify CMS transform
        run: python3 -m unittest discover -s tests -p test_cms_partb_provider_activity.py -v
      - name: Refresh statewide CMS Part B provider activity
        run: python3 scripts/update_cms_partb_provider_activity.py
      - name: Commit refreshed CMS snapshot
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/data/state/cms-partb-provider-activity.json)" ]; then
            echo "CMS Part B provider snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/state/cms-partb-provider-activity.json
          git commit -m "Refresh CMS Part B provider activity"
          git push origin HEAD:${GITHUB_REF_NAME}
