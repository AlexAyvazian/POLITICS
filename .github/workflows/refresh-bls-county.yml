name: Refresh BLS county labor market

on:
  workflow_dispatch:
  schedule:
    - cron: "52 2,14 * * *"
  push:
    paths:
      - scripts/update_bls_county_laus.py
      - tests/test_bls_county_laus.py
      - .github/workflows/refresh-bls-county.yml

permissions:
  contents: write

concurrency:
  group: refresh-bls-county
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify BLS county transform
        run: python3 -m unittest discover -s tests -p test_bls_county_laus.py -v
      - name: Refresh nationwide BLS county labor market
        run: python3 scripts/update_bls_county_laus.py
      - name: Commit refreshed snapshot
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/data/county/bls-laus.json)" ]; then
            echo "BLS county snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/county/bls-laus.json
          git commit -m "Refresh BLS county labor market"
          git push origin HEAD:${GITHUB_REF_NAME}
