name: Refresh FDIC county banking access

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    paths:
      - scripts/update_fdic_county_banking.py
      - tests/test_fdic_county_banking.py
      - .github/workflows/refresh-fdic-county-banking.yml

permissions:
  contents: write

concurrency:
  group: refresh-fdic-county-banking
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify FDIC county aggregation
        run: python3 -m unittest discover -s tests -p test_fdic_county_banking.py -v
      - name: Refresh current FDIC office locations
        run: python3 scripts/update_fdic_county_banking.py
      - name: Commit changed FDIC snapshot
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/data/county/fdic-banking-access.json)" ]; then
            echo "FDIC county banking snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/county/fdic-banking-access.json
          git commit -m "Refresh FDIC county banking access"
          git push origin HEAD:${GITHUB_REF_NAME}
