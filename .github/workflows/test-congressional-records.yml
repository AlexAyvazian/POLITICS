permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify state-first directory, exact member profiles, and voting joins
        run: node --test tests/congressional-records*.test.mjs
      - name: Verify retired Government Action navigation and preserved federal gateway
        run: node --test tests/government-action.test.mjs tests/gateway.test.mjs
      - name: Verify unified top-level navigation shell and Issue Stances
        run: node --test tests/unified-top-nav.test.mjs tests/issue-stances.test.mjs tests/issue-stances-gallery.test.mjs tests/issue-stances-layout-regression.test.mjs
      - name: Verify records refresh scheduling and member collection
        run: node --test tests/records-refresh.test.mjs tests/scheduled-collection.test.mjs tests/lda-search.test.mjs tests/lda-records-ui.test.mjs
      - name: Verify public data health and County Atlas transparency tabs
        run: node --test tests/data-health.test.mjs tests/county-transparency-tabs.test.mjs tests/federal-money-tab.test.mjs
      - name: Verify Data Sources is not public
        run: node --test tests/no-public-sources-page.test.mjs
      - name: Run full JS suite (informational; three unrelated legacy test failures)
        continue-on-error: true
        run: npm test
      - name: Verify USAspending county transform
        run: python3 -m unittest discover -s tests -p test_usaspending_county.py -v
      - name: Verify BLS County Atlas surface
        run: node --test tests/bls-county-tab.test.mjs
      - name: Verify Housing finance context surface
        run: node --test tests/housing-finance-tab.test.mjs
      - name: Verify HMDA and CFPB housing finance transforms
        run: python3 -m unittest discover -s tests -p test_housing_finance.py -v
      - name: Verify FDIC county banking-access surface
        run: node --test tests/fdic-banking-tab.test.mjs
      - name: Verify FDIC county banking aggregation
        run: python3 -m unittest discover -s tests -p test_fdic_county_banking.py -v
      - name: Verify EPA county air-monitoring surface
        run: node --test tests/epa-air-quality-tab.test.mjs
      - name: Verify EPA county monitoring transform and missing-data semantics
        run: python3 -m unittest discover -s tests -p test_epa_county_air_quality.py -v
      - name: Verify live Environment and Infrastructure sources
        run: node --test tests/live-environment-tab.test.mjs
      - name: Verify stored FCC county broadband snapshot architecture
        run: node --test tests/fcc-broadband-snapshot.test.mjs
      - name: Verify official LDA replacement has no LobbyView dependency
        run: node --test tests/no-lobbyview-official-lda-replacement.test.mjs
      - name: Verify CMS Part B gateway and Health surface
        run: node --test tests/public-apis.test.mjs tests/cms-partb-tab.test.mjs
      - name: Verify CMS Part B state transform
        run: python3 -m unittest discover -s tests -p test_cms_partb_provider_activity.py -v
      - name: Verify PAC funding aggregation, sector grouping, and leadership-PAC joins
        run: python3 -m unittest discover -s tests -p test_congressional_pac_funding.py -v
      - name: Verify DOJ FARA country normalization and documentary-source claims
        run: python3 -m unittest discover -s tests -p test_fara_world.py -v
      - name: Verify archived roll-call dataset joins and vote code meanings
        run: python3 -m unittest discover -s tests -p test_voteview_rollcalls.py -v
