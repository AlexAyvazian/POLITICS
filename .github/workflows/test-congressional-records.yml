name: Test Congressional Records directory

on:
  pull_request:
    paths:
      - records.html
      - assets/js/records.js
      - assets/js/records-model.js
      - assets/css/records-editorial.css
      - tests/congressional-records-editorial.test.mjs
      - tests/scheduled-collection.test.mjs
      - tests/category-reader.test.mjs
      - workers/politics-gateway.mjs
      - workers/records-refresh.mjs
      - wrangler.records.jsonc
      - tests/records-refresh.test.mjs
      - workers/county-snapshot.mjs
      - sources.html
      - assets/js/sources.js
      - assets/css/sources.css
      - tests/data-health.test.mjs
      - assets/js/map.js
      - assets/css/map.css
      - tests/county-transparency-tabs.test.mjs
      - tests/political-panel-pending.test.mjs
      - tests/lda-search.test.mjs
      - tests/lda-records-ui.test.mjs
      - tests/federal-money-tab.test.mjs
      - scripts/update_usaspending_county.py
      - tests/test_usaspending_county.py
      - .github/workflows/refresh-usaspending-county.yml
      - assets/data/county/usaspending.json
      - scripts/update_bls_county_laus.py
      - tests/test_bls_county_laus.py
      - tests/bls-county-tab.test.mjs
      - tests/bls-refresh-workflow.test.mjs
      - .github/workflows/refresh-bls-county.yml
      - assets/data/county/bls-laus.json
      - scripts/update_congressional_pac_funding.py
      - tests/test_congressional_pac_funding.py
      - ".github/workflows/test-congressional-records.yml"
  push:
    paths:
      - records.html
      - assets/js/records.js
      - assets/js/records-model.js
      - assets/js/states.js
      - assets/css/records.css
      - tests/congressional-records.test.mjs
      - tests/congressional-records-directory-ui.test.mjs
      - tests/congressional-records-silhouettes.test.mjs
      - tests/congressional-records-editorial.test.mjs
      - tests/congressional-records-dashboard.test.mjs
      - assets/css/records-editorial.css
      - assets/js/state-silhouettes.js
      - assets/js/records-address-model.js
      - workers/politics-gateway.mjs
      - workers/records-refresh.mjs
      - wrangler.records.jsonc
      - tests/records-refresh.test.mjs
      - tests/scheduled-collection.test.mjs
      - sources.html
      - assets/js/sources.js
      - assets/css/sources.css
      - tests/data-health.test.mjs
      - assets/js/map.js
      - assets/css/map.css
      - tests/county-transparency-tabs.test.mjs
      - tests/political-panel-pending.test.mjs
      - tests/lda-search.test.mjs
      - tests/lda-records-ui.test.mjs
      - tests/federal-money-tab.test.mjs
      - scripts/update_usaspending_county.py
      - tests/test_usaspending_county.py
      - .github/workflows/refresh-usaspending-county.yml
      - assets/data/county/usaspending.json
      - scripts/update_bls_county_laus.py
      - tests/test_bls_county_laus.py
      - tests/bls-county-tab.test.mjs
      - tests/bls-refresh-workflow.test.mjs
      - .github/workflows/refresh-bls-county.yml
      - assets/data/county/bls-laus.json
      - scripts/update_voteview_rollcalls.py
      - tests/test_voteview_rollcalls.py
      - scripts/update_congressional_pac_funding.py
      - tests/test_congressional_pac_funding.py
      - ".github/workflows/test-congressional-records.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify state-first directory, exact member profiles, and voting joins
        run: node --test tests/congressional-records*.test.mjs
      - name: Verify records refresh scheduling and member collection
        run: node --test tests/records-refresh.test.mjs tests/scheduled-collection.test.mjs tests/lda-search.test.mjs tests/lda-records-ui.test.mjs
      - name: Verify public data health and County Atlas transparency tabs
        run: node --test tests/data-health.test.mjs tests/county-transparency-tabs.test.mjs tests/federal-money-tab.test.mjs
      - name: Run full JS suite (informational; three unrelated legacy test failures)
        continue-on-error: true
        run: npm test
      - name: Verify USAspending county transform
        run: python3 -m unittest discover -s tests -p test_usaspending_county.py -v
      - name: Verify BLS county labor-market transform
        run: python3 -m unittest discover -s tests -p test_bls_county_laus.py -v
      - name: Verify BLS County Atlas surface and refresh workflow
        run: node --test tests/bls-county-tab.test.mjs tests/bls-refresh-workflow.test.mjs
      - name: Verify PAC funding aggregation, sector grouping, and leadership-PAC joins
        run: python3 -m unittest discover -s tests -p test_congressional_pac_funding.py -v
      - name: Verify DOJ FARA country normalization and documentary-source claims
        run: python3 -m unittest discover -s tests -p test_fara_world.py -v
      - name: Verify archived roll-call dataset joins and vote code meanings
        run: python3 -m unittest discover -s tests -p test_voteview_rollcalls.py -v
