name: Refresh FCC county broadband availability

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  push:
    paths:
      - "scripts/update_fcc_broadband.py"
      - ".github/workflows/refresh-fcc-broadband.yml"

permissions:
  contents: write

concurrency:
  group: refresh-fcc-broadband
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh official FCC county availability snapshot
        run: python3 scripts/update_fcc_broadband.py
      - name: Commit snapshot if changed
        run: |
          if [ -z "$(git status --porcelain -- assets/data/county/fcc-broadband-availability.json)" ]; then
            echo "FCC county snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/county/fcc-broadband-availability.json
          git commit -m "data: refresh FCC county broadband availability"
          git pull --rebase origin main
          git push origin HEAD:main
