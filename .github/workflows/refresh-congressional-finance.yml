name: Refresh FEC congressional finance
on:
  schedule:
    - cron: "12 13 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/update_congressional_finance.py
      - tests/test_congressional_finance.py
      - .github/workflows/refresh-congressional-finance.yml
permissions:
  contents: write
concurrency:
  group: congressional-finance-daily
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load trusted roster parser
        run: python -m pip install --quiet PyYAML
      - name: Verify finance mapping and arithmetic
        run: python -m unittest discover -s tests -p test_congressional_finance.py -v
      - name: Download official FEC report and build matching member records
        run: python scripts/update_congressional_finance.py
      - name: Commit updated per-member financial data only
        shell: bash
        run: |
          git add assets/data/records/finance/
          if git diff --cached --quiet; then
            echo "No updated amounts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh official FEC candidate financial snapshots"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
